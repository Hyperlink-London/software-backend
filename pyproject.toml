# https://peps.python.org/pep-0517/
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# https://peps.python.org/pep-0621/
[project]
name = "hyperlink-api"
version = "0.1.0"  # Set a static version here
description = "An API for interfacing with hyperlink databases"
readme = "README.md"
requires-python = ">=3.8, <3.11"
license = { text = "BSD 3-Clause License" }
authors = [
    { email = "barnish.harry@gmail.com", name = "Harry Barnish" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = [
#    "hyperlink-data-models",
    "fastapi",
    "uvicorn",
    "sqlmodel==0.0.8",
    "typer",
    "psycopg2-binary",
]

[project.optional-dependencies]
test = ["pytest>=6.0", "pytest-cov"]
dev = [
    "black",
    "ipython",
    "mypy",
    "pdbpp",
    "pre-commit",
    "pytest-cov",
    "pytest",
    "rich",
    "ruff",
]

[project.urls]
homepage = "https://github.com/Hyperlink-London/hyperlink-backend"
repository = "https://github.com/Hyperlink-London/hyperlink-backend"

[project.scripts]
hyperlink-api = "hyperlink_api:cli"
