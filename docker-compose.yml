services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app  # Map the local directory to the container's working directory
    x-deploy:
      filewatcher:
        sync: true  # Enable sync action for automatic refresh on file changes
    networks:
      - hyperlink_network

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: hyperlink
      POSTGRES_PASSWORD: hyperlink_psw
      POSTGRES_DB: hyperlink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hyperlink_network  # Attach to the custom network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_container
    restart: unless-stopped
    ports:
      - "8081:80" # Access pgAdmin at http://localhost:8081
    environment:
      PGADMIN_DEFAULT_EMAIL: barnish.harry@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json
    networks:
      - hyperlink_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  hyperlink_network:
    driver: bridge
