name: Build and Test Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose V2
        run: |
          sudo curl -L https://github.com/docker/compose/releases/download/v2.27.0/docker-compose-linux-x86_64 \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version

      - name: Create .env from GitHub Secrets
        run: |
          cat <<EOF > .env
          APPLICATION_HOST=${{ secrets.APPLICATION_HOST }}
          APPLICATION_PORT=${{ secrets.APPLICATION_PORT }}
          PRODUCTION_DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}
          TEST_DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}
          EOF

      - name: Build and start containers
        run: docker-compose up -d --build

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API to be ready..."
          sleep 20
          curl --fail http://localhost:8000/health_check || (docker-compose logs && exit 1)
