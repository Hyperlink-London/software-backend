name: Build and Test Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:13
        env:
          POSTGRES_USER: hyperlink
          POSTGRES_PASSWORD: hyperlink_psw
          POSTGRES_DB: hyperlink_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hyperlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Set up Docker with Compose
        uses: docker/setup-docker@v2
        with:
          version: 'latest'
          compose: true

      - name: Create .env from GitHub Secrets
        run: |
          cat <<EOF > .env
          APPLICATION_HOST=${{ secrets.APPLICATION_HOST }}
          APPLICATION_PORT=${{ secrets.APPLICATION_PORT }}
          PRODUCTION_DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}
          TEST_DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}
          EOF

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API to be ready..."
          sleep 20
          curl --fail http://localhost:8000/health_check || (docker compose logs && exit 1)
